name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (H2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B verify

  # Mesma suíte contra PostgreSQL de verdade: pega diferenças que o H2 esconde.
  backend-postgres:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pedeai
          POSTGRES_USER: pedeai
          POSTGRES_PASSWORD: pedeai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pedeai -d pedeai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/pedeai
      SPRING_DATASOURCE_USERNAME: pedeai
      SPRING_DATASOURCE_PASSWORD: pedeai
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B test

  agent:
    name: Agente de impressão
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B verify

  # A imagem de produção da API (deploy/compose.prod.yaml e Railway) precisa continuar montando.
  api-image:
    name: Imagem da API (Docker)
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --tag pedeai-api:ci backend

  # Instalador do agente para o computador da loja. O runner Windows já tem o WiX, que o jpackage usa para o MSI.
  # O .msi fica nos artefatos da execução do CI.
  agent-installer:
    name: Instalador do agente (Windows)
    needs: agent
    runs-on: windows-2022
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: .\mvnw.cmd -B package -DskipTests
      - run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item target\pedeai-agent.jar staging\
          jpackage --type msi --name PedeAiAgente --app-version 0.2.0 --vendor PedeAi `
            --description "Agente de impressao do PedeAi" `
            --input staging --main-jar pedeai-agent.jar `
            --add-modules java.base,java.desktop,java.net.http,jdk.charsets `
            --win-console --win-per-user-install --win-menu --win-menu-group PedeAi --win-shortcut `
            --win-upgrade-uuid b5c6b089-9c5e-477c-834a-e9b414bfdb43 --dest dist
      # Assina o MSI quando houver certificado (segredos WINDOWS_CERT_PFX em base64 e WINDOWS_CERT_PASSWORD). Sem
      # eles, o instalador sai sem assinatura e o Windows mostra o aviso do SmartScreen.
      - name: Assinar o instalador
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX) { Write-Output "Sem certificado: MSI sem assinatura."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP cert.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 (Get-ChildItem dist\*.msi).FullName
          $code = $LASTEXITCODE
          Remove-Item $pfx
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: PedeAiAgente-msi
          path: agent/dist/*.msi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
