# Produção num servidor próprio (por exemplo, a VM "Always Free" da Oracle Cloud): API, PostgreSQL, HTTPS e backup.
# Uso, na pasta deploy/: cp .env.prod.example .env && (edite) && docker compose -f compose.prod.yaml up -d --build
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Sem porta publicada: só a API e o backup, na rede interna, falam com o banco.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_COOKIE_SECURE: "true"
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-false}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      IFOOD_ENABLED: ${IFOOD_ENABLED:-false}
      IFOOD_CLIENT_ID: ${IFOOD_CLIENT_ID:-}
      IFOOD_CLIENT_SECRET: ${IFOOD_CLIENT_SECRET:-}
      NINETYNINE_BASE_URL: ${NINETYNINE_BASE_URL:-}
      NINETYNINE_CLIENT_ID: ${NINETYNINE_CLIENT_ID:-}
      NINETYNINE_CLIENT_SECRET: ${NINETYNINE_CLIENT_SECRET:-}
      NINETYNINE_APP_ID: ${NINETYNINE_APP_ID:-}
      OPENDELIVERY_APP_NAME: ${OPENDELIVERY_APP_NAME:-Open Delivery}
      OPENDELIVERY_BASE_URL: ${OPENDELIVERY_BASE_URL:-}
      OPENDELIVERY_CLIENT_ID: ${OPENDELIVERY_CLIENT_ID:-}
      OPENDELIVERY_CLIENT_SECRET: ${OPENDELIVERY_CLIENT_SECRET:-}
      OPENDELIVERY_APP_ID: ${OPENDELIVERY_APP_ID:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # HTTPS automático (Let's Encrypt) para o domínio da API. Precisa das portas 80 e 443 abertas no servidor.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

  # Backup diário do banco, guardando os últimos 7 dias em ./backups. Copie essa pasta para fora do servidor.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump --format=custom --file="/backups/pedeai-$$(date +%Y%m%d-%H%M).dump" \
            && find /backups -name 'pedeai-*.dump' -mtime +7 -delete
          sleep 86400
        done

volumes:
  postgres-data:
  caddy-data:
