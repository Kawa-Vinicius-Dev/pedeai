# Produção com o banco no Supabase: só a API, o HTTPS (Caddy) e o backup rodam no servidor.
# Use em vez do compose.prod.yaml quando o PostgreSQL ficar no Supabase (docs/07-deploy.md).
# Uso, na pasta deploy/: cp .env.supabase.example .env && (edite) && docker compose -f compose.supabase.yaml up -d --build
services:
  api:
    build: ../backend
    restart: unless-stopped
    environment:
      # Pooler do Supabase em modo sessão (IPv4). Usuário no formato <papel>.<id do projeto>.
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # O plano grátis do Supabase tem poucas conexões: a API não precisa de mais que isto.
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_COOKIE_SECURE: "true"
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-false}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      IFOOD_ENABLED: ${IFOOD_ENABLED:-false}
      IFOOD_CLIENT_ID: ${IFOOD_CLIENT_ID:-}
      IFOOD_CLIENT_SECRET: ${IFOOD_CLIENT_SECRET:-}
      NINETYNINE_BASE_URL: ${NINETYNINE_BASE_URL:-}
      NINETYNINE_CLIENT_ID: ${NINETYNINE_CLIENT_ID:-}
      NINETYNINE_CLIENT_SECRET: ${NINETYNINE_CLIENT_SECRET:-}
      NINETYNINE_APP_ID: ${NINETYNINE_APP_ID:-}
      OPENDELIVERY_APP_NAME: ${OPENDELIVERY_APP_NAME:-Open Delivery}
      OPENDELIVERY_BASE_URL: ${OPENDELIVERY_BASE_URL:-}
      OPENDELIVERY_CLIENT_ID: ${OPENDELIVERY_CLIENT_ID:-}
      OPENDELIVERY_CLIENT_SECRET: ${OPENDELIVERY_CLIENT_SECRET:-}
      OPENDELIVERY_APP_ID: ${OPENDELIVERY_APP_ID:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # HTTPS automático (Let's Encrypt) para o domínio da API. Precisa das portas 80 e 443 abertas no servidor.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

  # O plano grátis do Supabase não tem backup que dê para baixar: um dump por dia em ./backups, guardando 7 dias.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: ${PGHOST}
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
      PGSSLMODE: require
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump --format=custom --schema=pedeai --file="/backups/pedeai-$$(date +%Y%m%d-%H%M).dump" \
            && find /backups -name 'pedeai-*.dump' -mtime +7 -delete
          sleep 86400
        done

volumes:
  caddy-data:
