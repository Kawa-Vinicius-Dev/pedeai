spring:
  datasource:
    url: jdbc:h2:mem:pedeai;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  auth:
    jwt-secret: test-secret-with-at-least-thirty-two-bytes
    jwt-issuer: pedeai
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    refresh-cookie-name: pedeai_refresh
    refresh-cookie-secure: false
  signup-enabled: true
  cors-allowed-origins: http://localhost:5173
