spring:
  application:
    name: pedeai-api
  config:
    # Em desenvolvimento, a API lê o mesmo .env do docker compose (na raiz do repositório).
    # Variáveis de ambiente de verdade (CI, produção) têm prioridade sobre o arquivo.
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
  # Fotos de produto: a tela reduz antes de mandar e a API recusa acima de 2 MB.
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB

server:
  error:
    include-stacktrace: never
    include-message: never

# Sem SENTRY_DSN o Sentry fica desligado. Só erros (sem traces) e sem dados pessoais.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}
  send-default-pii: false
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  auth:
    jwt-secret: ${JWT_SECRET}
    jwt-issuer: pedeai
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    refresh-reuse-grace: PT30S
    refresh-cookie-name: pedeai_refresh
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
  signup-enabled: ${SIGNUP_ENABLED:true}
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Versão mais recente do agente de impressão: computadores com versão menor aparecem como desatualizados.
  agent:
    latest-version: ${AGENT_LATEST_VERSION:0.2.0}
    download-url: ${AGENT_DOWNLOAD_URL:}
  # Aplicativo centralizado no iFood Developer. Sem credenciais, a integração fica desligada.
  ifood:
    enabled: ${IFOOD_ENABLED:false}
    client-id: ${IFOOD_CLIENT_ID:}
    client-secret: ${IFOOD_CLIENT_SECRET:}
    simulator: ${IFOOD_SIMULATOR:false}
  # Fotos dos produtos no Cloudflare R2 (docs/07-deploy.md). Sem estas variáveis, as fotos ficam desligadas.
  r2:
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket: ${R2_BUCKET:}
    public-url: ${R2_PUBLIC_URL:}
  # Apps no padrão Open Delivery (docs/05-integracoes.md#open-delivery). Sem URL e credenciais, o app fica desligado.
  opendelivery:
    simulator: ${OPENDELIVERY_SIMULATOR:false}
    apps:
      - provider: NINETY_NINE_FOOD
        name: 99Food
        base-url: ${NINETYNINE_BASE_URL:}
        client-id: ${NINETYNINE_CLIENT_ID:}
        client-secret: ${NINETYNINE_CLIENT_SECRET:}
        app-id: ${NINETYNINE_APP_ID:}
      - provider: OPEN_DELIVERY
        name: ${OPENDELIVERY_APP_NAME:Open Delivery}
        base-url: ${OPENDELIVERY_BASE_URL:}
        client-id: ${OPENDELIVERY_CLIENT_ID:}
        client-secret: ${OPENDELIVERY_CLIENT_SECRET:}
        app-id: ${OPENDELIVERY_APP_ID:}
